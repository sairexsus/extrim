<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Симулятор іспиту з гістології</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f11;
      color: #e5e5e7;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 25px;
      background: #16161a;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      color: #ffffff;
      font-size: 26px;
      margin-bottom: 5px;
    }
    h2 {
      color: #ff9f43;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-top: 25px;
    }
    .block-header {
      background: #1e1e24;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid #ff9f43;
    }
    .block-header h3 {
      margin: 0 0 5px 0;
      color: #ff9f43;
    }
    .block-header p {
      margin: 0;
      color: #aaa;
      font-size: 14px;
    }
    .topic-title {
      background: #1e1e24;
      padding: 12px;
      border-radius: 6px;
      color: #00ff99;
      font-size: 18px;
      margin-bottom: 15px;
      border-left: 4px solid #00ff99;
    }
    #timer {
      font-size: 22px;
      text-align: center;
      margin: 15px 0;
      color: #00ff99;
      font-weight: bold;
      background: #1e1e24;
      padding: 10px;
      border-radius: 8px;
    }
    .question {
      background: #22222b;
      padding: 16px;
      margin: 15px 0;
      border-radius: 8px;
      border-left: 5px solid #0052cc;
    }
    .question p {
      margin: 0 0 12px 0;
      font-size: 16px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
      background: #32323e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      background: #454556;
    }
    button.active-0 { background: #ee5253 !important; border-color: #ff6b6b; }
    button.active-05 { background: #feca57 !important; border-color: #ffff66; color: #000; }
    button.active-1 { background: #10ac84 !important; border-color: #1dd1a1; }
    
    .nav-btn {
      margin-top: 25px;
      background: #0052cc;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      width: 100%;
      border-radius: 8px;
      color: white;
      font-weight: bold;
    }
    .nav-btn:hover {
      background: #0066ff;
    }
    
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #1e1e24;
      border-radius: 8px;
      overflow: hidden;
    }
    .results-table th, .results-table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    .results-table th {
      background: #2a2a35;
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
    }
    .bad-grade { color: #ee5253; font-weight: bold; }
    .normal-grade { color: #feca57; font-weight: bold; }
    .good-grade { color: #10ac84; font-weight: bold; }
    
    .final-score-row {
      font-size: 22px;
      margin-top: 25px;
      padding: 20px;
      background: #222230;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #444;
    }
    .block-result {
      background: #1e1e24;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid;
    }
    .block-result h4 {
      margin: 0 0 10px 0;
    }
    .summary-block {
      background: #2a2a35;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="header-area">
    <h1>Гістологія — Комплексний іспит</h1>
  </div>
  <div id="timer" style="display:none;">Завантаження таймера...</div>
  <div id="block"></div>
  <div id="summary-report"></div>
</div>

<script>
// ==========================================
// БЛОК 1: СПЕЦІАЛЬНА ГІСТОЛОГІЯ (ПО ТЕМАМ)
// ==========================================
const specialHistologyTopics = [
  {
    name: "Тема 1: Морфофункціональна характеристика діоптричного апарату ока",
    questions: [
      { id: "s1_1", text: "Перерахувати компоненти діоптричного (світлозаломлювального) апарату ока.", points: 15 },
      { id: "s1_2", text: "Назвати 5 шарів рогівки у правильній послідовності.", points: 20 },
      { id: "s1_3", text: "Морфологічна характеристика переднього епітелію рогівки (тип і вид тканини).", points: 10 },
      { id: "s1_4", text: "Тип, вид тканини та структурні компоненти власної речовини рогівки.", points: 15 },
      { id: "s1_5", text: "Які специфічні речовини забезпечують прозорість власної речовини рогівки?", points: 15 },
      { id: "s1_6", text: "Основні три структурні компоненти кришталика.", points: 15 },
      { id: "s1_7", text: "Тканинний склад та локалізація росткової зони кришталика.", points: 15 },
      { id: "s1_8", text: "Назва білка кришталикових волокон.", points: 10 },
      { id: "s1_9", text: "Яким чином здійснюється живлення безсудинних структур ока (рогівки та кришталика) та яка структура бере участь в утворенні цієї рідини?", points: 20 },
      { id: "s1_10", text: "Циркуляція водянистої вологи: назвати 5 структур у послідовності від утворення до відтоку.", points: 25 },
      { id: "s1_11", text: "Склисте тіло: локалізація, морфологічна характеристика аморфної речовини, клітин та тип волокон.", points: 20 }
    ]
  },
  {
    name: "Тема 2: Морфофункціональна характеристика селезінки",
    questions: [
      { id: "s2_1", text: "Перерахувати 5 основних функцій селезінки.", points: 20 },
      { id: "s2_2", text: "Груба строма селезінки: компоненти та які клітини (крім сполучнотканинних) вона містить.", points: 15 },
      { id: "s2_3", text: "Якою тканиною утворена ніжна строма селезінки та на які дві зони поділяється її паренхіма?", points: 15 },
      { id: "s2_4", text: "Характеристика білої пульпи селезінки: особливості забарвлення при H&E, причина такого забарвлення та її основні елементи.", points: 20 },
      { id: "s2_5", text: "Періартеріальні лімфоїдні піхви (ПАЛП): тип переважаючих лімфоцитів, зона та навколо яких судин вони формуються.", points: 20 },
      { id: "s2_6", text: "Лімфоїдний фолікул селезінки: назвати чотири зони, судини крайової зони та переважаючий тип лімфоцитів.", points: 25 },
      { id: "s2_7", text: "Характеристика червоної пульпи селезінки: забарвлення при H&E, причина та її основні компоненти.", points: 15 },
      { id: "s2_8", text: "Назвати 5 типів клітин, що входять до клітинного складу тяжів Більрота.", points: 20 },
      { id: "s2_9", text: "Особливості будови венозних синусів селезінки: forma та орієнтація ендотеліоцитів, особливості базальної мембрани та функціональне значення цієї структури.", points: 30 }
    ]
  }
];

// ==========================================
// БЛОК 2: ЗАГАЛЬНА ГІСТОЛОГІЯ (ПО ТЕМАМ)
// ==========================================
const generalHistologyTopics = [
  {
    name: "Тема 1: Світлова мікроскопія",
    questions: [
      { id: "g1_1", text: "Три частини, які входять до складу світлового мікроскопа.", points: 20 },
      { id: "g1_2", text: "Чотири складові освітлювальної частини світлового мікроскопа.", points: 20 },
      { id: "g1_3", text: "Два типу джерел світла у світловій мікроскопії.", points: 10 },
      { id: "g1_4", text: "Чотири складові механічної частини світлового мікроскопа.", points: 20 },
      { id: "g1_5", text: "Два складові оптичної частини мікроскопа.", points: 10 },
      { id: "g1_6", text: "Два види об'єктивів (за конструкцією та використанням).", points: 10 },
      { id: "g1_7", text: "Формула визначення збільшення об’єкта.", points: 10 },
      { id: "g1_8", text: "Визначення роздільної здатності мікроскопа.", points: 20 },
      { id: "g1_9", text: "Шість різновидів світлової мікроскопії.", points: 20 },
      { id: "g1_10", text: "Аберація, її визначення та основні 6 видів аберацій у світловому мікроскопі.", points: 30 }
    ]
  },
  {
    name: "Тема 2: Морфофункціональна характеристика кісткової тканини",
    questions: [
      { id: "g2_1", text: "Три типу клітин та загальні характеристики міжклітинної речовини (органічна і неорганічна частини).", points: 25 },
      { id: "g2_2", text: "Характеристика остеобласта: локалізація, будова, забарвлення цитоплазми та функція.", points: 20 },
      { id: "g2_3", text: "Характеристика остеоцита: локалізація, форма клітини, функція.", points: 15 },
      { id: "g2_4", text: "Характеристика остеокласта: локалізація, походження, будова та функція.", points: 25 },
      { id: "g2_5", text: "Організація міжклітинної речовини: тип волокон, класифікація кісткової тканини (3 типи) та розміщення колагенових волокон у різних типах.", points: 25 },
      { id: "g2_6", text: "Шари компактної пластинчастої кістки (діафіза) — назвати 3 шари.", points: 15 },
      { id: "g2_7", text: "Будова остеона: структури у каналі Гаверса, вистелення каналу, розташування пластинок, клітини між ними та зовнішня межа.", points: 30 }
    ]
  }
];

// ==========================================
// БЛОК 3: ГІСТОЛОГІЧНІ ПРЕПАРАТИ (МІКРОПРЕПАРАТИ)
// ==========================================
const slideTopics = [
  {
    name: "Препарат 1: Стінка серця (волокна Пуркін'є)",
    questions: [
      { id: "p1_1", text: "Надайте морфологічну характеристику препарату. Назвіть забарвлення ядер (метод H&E).", points: 15 },
      { id: "p1_2", text: "Перерахуйте у правильній послідовності всі 4 шари ендокарду.", points: 20 },
      { id: "p1_3", text: "Волокна Пуркін'є: вкажіть тип кардіоміоцитів, розмір клітин, кількість і розташування міофібрил.", points: 25 },
      { id: "p1_4", text: "Волокна Пуркін'є: яке забарвлення має цитоплазма (H&E), які включення містяться у великій кількості і чому вони не візуалізуються?", points: 25 },
      { id: "p1_5", text: "Які клітини розташовані праворуч і ліворуч від волокон (виглядають як порожні «персні»)? Вкажіть тканинний склад міокарда.", points: 15 }
    ]
  },
  {
    name: "Препарат 2: Щитоподібна та прищитоподібна залози",
    questions: [
      { id: "p2_1", text: "Залоза в нижній частині: назва, структурні елементи паренхіми, тканина строми та компоненти фолікула.", points: 20 },
      { id: "p2_2", text: "Клітини 1 щитоподібної залози: назва, локалізація, гормони та від чого залежить їхня висота.", points: 25 },
      { id: "p2_3", text: "Клітини 2 щитоподібної залози: назва (С-клітини), локалізація та гормон, який вони продукують.", points: 20 },
      { id: "p2_4", text: "Залоза у верхній частині: назва, структури паренхіми, тканина строми.", points: 15 },
      { id: "p2_5", text: "Клітини прищитоподібної залози: характеристики Головних (розмір, забарвлення, функція) та Оксифільних (розмір, забарвлення, здатність до секреції) паратироцитів.", points: 25 }
    ]
  }
];

// Global State
let currentBlockIndex = 2; // Починаємо з блоку 2 (Загальна гістологія)
let blockResults = {
  1: { name: "Спеціальна гістологія", earned: 0, total: 0, answers: [], questions: [], topicName: "" },
  2: { name: "Загальна гістологія", earned: 0, total: 0, answers: [], questions: [], topicName: "" },
  3: { name: "Гістологічні препарати", earned: 0, total: 0, answers: [], questions: [], topicName: "" }
};

let currentQuestions = [];
let currentTopicInfo = null;
let userAnswers = {}; 
let timerInterval = null;
let timeLeft = 0; 
let totalExamPoints = 0;

// Функція для перемішування масиву
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Функція для отримання випадкової теми з блоку
function getRandomTopic(blockNum) {
  let topics = [];
  if (blockNum === 1) {
    topics = specialHistologyTopics;
  } else if (blockNum === 2) {
    topics = generalHistologyTopics;
  } else if (blockNum === 3) {
    topics = slideTopics;
  }
  
  const randomIndex = Math.floor(Math.random() * topics.length);
  const selectedTopic = topics[randomIndex];
  
  const shuffledQuestions = shuffleArray([...selectedTopic.questions]);
  
  return {
    name: selectedTopic.name,
    questions: shuffledQuestions
  };
}

function getBlockName(blockNum) {
  if (blockNum === 1) return "СПЕЦІАЛЬНА ГІСТОЛОГІЯ";
  if (blockNum === 2) return "ЗАГАЛЬНА ГІСТОЛОГІЯ";
  return "ГІСТОЛОГІЧНІ ПРЕПАРАТИ";
}

window.onload = function() {
  startBlock();
};

function startBlock() {
  clearInterval(timerInterval);
  document.getElementById('summary-report').innerHTML = '';
  userAnswers = {};
  
  // Отримуємо випадкову тему для поточного блоку
  const randomTopic = getRandomTopic(currentBlockIndex);
  currentTopicInfo = randomTopic.name;
  currentQuestions = randomTopic.questions;
  
  // Зберігаємо тему в результати блоку
  blockResults[currentBlockIndex].topicName = currentTopicInfo;
  blockResults[currentBlockIndex].questions = currentQuestions;
  blockResults[currentBlockIndex].answers = [];
  
  totalExamPoints = 0;
  currentQuestions.forEach(q => {
    totalExamPoints += q.points;
    userAnswers[q.id] = null;
    blockResults[currentBlockIndex].answers.push({ id: q.id, text: q.text, points: q.points, status: null });
  });
  blockResults[currentBlockIndex].total = totalExamPoints;
  
  timeLeft = 5 * 60; // 5 хвилин
  
  document.getElementById('timer').style.display = 'block';
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      alert("Час вичерпано! Перехід до наступного блоку.");
      finishCurrentBlock();
    }
  }, 1000);
  
  renderQuestions();
}

function updateTimerDisplay() {
  let min = Math.floor(timeLeft / 60);
  let sec = timeLeft % 60;
  document.getElementById('timer').innerText = `Залишилось часу: ${min}:${sec < 10 ? '0' : ''}${sec}`;
}

function renderQuestions() {
  let html = `
    <div class="block-header">
      <h3>📚 БЛОК ${currentBlockIndex}: ${getBlockName(currentBlockIndex)}</h3>
      <p>🎲 Випадково обрана тема: <strong style="color:#00ff99;">${currentTopicInfo}</strong></p>
      <p>📝 Всього питань: ${currentQuestions.length} | ⏱️ Час на блок: 5 хвилин</p>
    </div>
  `;
  
  currentQuestions.forEach((q, index) => {
    let active0 = userAnswers[q.id] === 0 ? "active-0" : "";
    let active05 = userAnswers[q.id] === 0.5 ? "active-05" : "";
    let active1 = userAnswers[q.id] === 1 ? "active-1" : "";
    
    html += `
      <div class="question" id="q_container_${q.id}">
        <p><strong>Питання ${index + 1} [Бал: ${q.points}]:</strong> ${q.text}</p>
        <div class="btn-group">
          <button class="${active1}" onclick="setAnswer('${q.id}', 1)">Повна правильна відповідь (100%)</button>
          <button class="${active05}" onclick="setAnswer('${q.id}', 0.5)">Часткова/неповна відповідь (50%)</button>
          <button class="${active0}" onclick="setAnswer('${q.id}', 0)">Неправильна відповідь / Не знає (0%)</button>
        </div>
      </div>
    `;
  });
  
  html += `<button class="nav-btn" onclick="finishCurrentBlock()">ЗАВЕРШИТИ БЛОК ТА ПЕРЕЙТИ ДО НАСТУПНОГО</button>`;
  document.getElementById('block').innerHTML = html;
  window.scrollTo(0, 0);
}

function setAnswer(qId, val) {
  userAnswers[qId] = val;
  
  // Оновлюємо збережені відповіді в результатах блоку
  const answerIndex = blockResults[currentBlockIndex].answers.findIndex(a => a.id === qId);
  if (answerIndex !== -1) {
    blockResults[currentBlockIndex].answers[answerIndex].status = val;
  }
  
  const container = document.getElementById(`q_container_${qId}`);
  if (container) {
    const btns = container.querySelectorAll('.btn-group button');
    if (btns.length >= 3) {
      btns[0].className = val === 1 ? "active-1" : "";
      btns[1].className = val === 0.5 ? "active-05" : "";
      btns[2].className = val === 0 ? "active-0" : "";
    }
  }
}

function finishCurrentBlock() {
  clearInterval(timerInterval);
  
  // Розрахунок результатів поточного блоку
  let earned = 0;
  blockResults[currentBlockIndex].answers.forEach(a => {
    if (a.status === 1) earned += a.points;
    else if (a.status === 0.5) earned += (a.points * 0.5);
  });
  blockResults[currentBlockIndex].earned = earned;
  
  // Перехід до наступного блоку або завершення
  if (currentBlockIndex === 2) {
    currentBlockIndex = 1;
    startBlock();
  } else if (currentBlockIndex === 1) {
    currentBlockIndex = 3;
    startBlock();
  } else if (currentBlockIndex === 3) {
    showFinalResults();
  }
}

function getGrade(percentage) {
  if (percentage >= 90) return { grade5: 5, ects: "A", style: "good-grade" };
  if (percentage >= 85) return { grade5: 4, ects: "B", style: "good-grade" };
  if (percentage >= 75) return { grade5: 4, ects: "C", style: "good-grade" };
  if (percentage >= 65) return { grade5: 3, ects: "D", style: "normal-grade" };
  if (percentage >= 60) return { grade5: 3, ects: "E", style: "normal-grade" };
  if (percentage >= 35) return { grade5: 2, ects: "FX", style: "bad-grade" };
  return { grade5: 2, ects: "F", style: "bad-grade" };
}

function showFinalResults() {
  document.getElementById('timer').style.display = 'none';
  
  let totalEarned = 0;
  let totalMax = 0;
  
  let blocksHtml = "";
  
  for (let i = 1; i <= 3; i++) {
    const block = blockResults[i];
    const percentage = block.total > 0 ? (block.earned / block.total) * 100 : 0;
    const grade = getGrade(percentage);
    totalEarned += block.earned;
    totalMax += block.total;
    
    blocksHtml += `
      <div class="block-result" style="border-left-color: ${grade.style === 'good-grade' ? '#10ac84' : (grade.style === 'normal-grade' ? '#feca57' : '#ee5253')};">
        <h4>📖 БЛОК ${i}: ${block.name}</h4>
        <p><strong>Тема:</strong> ${block.topicName}</p>
        <p><strong>Результат:</strong> ${block.earned.toFixed(1)} / ${block.total} балів (${percentage.toFixed(1)}%)</p>
        <p><strong>Оцінка:</strong> <span class="${grade.style}">${grade.grade5} (${grade.ects})</span></p>
      </div>
    `;
  }
  
  const totalPercentage = (totalEarned / totalMax) * 100;
  const totalGrade = getGrade(totalPercentage);
  
  let reportHtml = `
    <div class="topic-title" style="text-align:center; font-weight:bold; color:#fff; font-size:22px; border-left:none; background:#222230;">
      🎓 ПІДСУМКОВИЙ ПРОТОКОЛ ІСПИТУ З ГІСТОЛОГІЇ
    </div>
    
    <div class="summary-block">
      <div class="final-score-row" style="margin-top:0;">
        <div>
          <strong>Загальний бал:</strong> <span class="${totalGrade.style}">${totalEarned.toFixed(1)} / ${totalMax}</span> 
          <span style="font-size:16px; color:#aaa;">(${totalPercentage.toFixed(1)}%)</span>
        </div>
        <div>
          <strong>Підсумкова оцінка:</strong> <span class="${totalGrade.style}">${totalGrade.grade5} (${totalGrade.ects})</span>
        </div>
      </div>
    </div>
    
    <h3 style="margin-top:25px; color:#ff9f43;">📊 РЕЗУЛЬТАТИ ПО БЛОКАХ</h3>
    ${blocksHtml}
  `;
  
  // Деталізація по кожному блоку
  for (let i = 1; i <= 3; i++) {
    const block = blockResults[i];
    reportHtml += `
      <h3 style="margin-top:25px; color:#ff9f43;">📋 Деталізація блоку ${i}: ${block.name}</h3>
      <p><strong>Тема:</strong> ${block.topicName}</p>
      <table class="results-table">
        <thead>
          <tr><th>№</th><th>Питання</th><th>Макс</th><th>Набрано</th><th>Статус</th></tr>
        </thead>
        <tbody>
    `;
    
    block.answers.forEach((a, idx) => {
      let earned = 0;
      let label = "Не знає / Помилка";
      let cls = "bad-grade";
      
      if (a.status === 1) { earned = a.points; label = "Зараховано (100%)"; cls = "good-grade"; }
      else if (a.status === 0.5) { earned = a.points * 0.5; label = "Частково (50%)"; cls = "normal-grade"; }
      else if (a.status === null) { label = "Без відповіді"; }
      
      reportHtml += `
        <tr>
          <td>${idx + 1}</td>
          <td>${a.text}</td>
          <td><strong>${a.points}</strong></td>
          <td><strong class="${cls}">${earned.toFixed(1)}</strong></td>
          <td class="${cls}">${label}</td>
        </tr>
      `;
    });
    
    reportHtml += `</tbody></table>`;
  }
  
  reportHtml += `<button class="nav-btn" style="background:#282833; border:1px solid #444; margin-top:30px;" onclick="resetExam()">🔄 ПРОЙТИ ІСПИТ ЗНОВУ</button>`;
  
  document.getElementById('block').innerHTML = '';
  document.getElementById('summary-report').innerHTML = reportHtml;
  window.scrollTo(0, 0);
}

function resetExam() {
  // Скидаємо всі результати
  blockResults = {
    1: { name: "Спеціальна гістологія", earned: 0, total: 0, answers: [], questions: [], topicName: "" },
    2: { name: "Загальна гістологія", earned: 0, total: 0, answers: [], questions: [], topicName: "" },
    3: { name: "Гістологічні препарати", earned: 0, total: 0, answers: [], questions: [], topicName: "" }
  };
  currentBlockIndex = 2;
  startBlock();
}
</script>

</body>
</html>
