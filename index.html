<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Симулятор іспиту з гістології</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f11;
      color: #e5e5e7;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #16161a;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      color: #ffffff;
      font-size: 24px;
      margin-bottom: 5px;
    }
    h2 {
      color: #ff9f43;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-top: 20px;
    }
    #timer {
      font-size: 24px;
      text-align: center;
      margin: 15px 0;
      color: #00ff99;
      font-weight: bold;
      background: #1e1e24;
      padding: 10px;
      border-radius: 8px;
    }
    .question {
      background: #22222b;
      padding: 16px;
      margin: 15px 0;
      border-radius: 8px;
      border-left: 5px solid #ff9f43;
      transition: transform 0.2s;
    }
    .question p {
      margin: 0 0 12px 0;
      font-size: 16px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
      background: #32323e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      background: #454556;
    }
    button.active-0 { background: #ee5253 !important; border-color: #ff6b6b; }
    button.active-05 { background: #feca57 !important; border-color: #ffff66; color: #000; }
    button.active-1 { background: #10ac84 !important; border-color: #1dd1a1; }
    
    .nav-btn {
      margin-top: 25px;
      background: #0052cc;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      width: 100%;
      border-radius: 8px;
    }
    .nav-btn:hover {
      background: #0066ff;
    }
    #result {
      margin-top: 25px;
      font-size: 20px;
      text-align: center;
      padding: 20px;
      background: #1e1e24;
      border-radius: 8px;
      border: 1px solid #333;
    }
    #result strong {
      color: #00ff99;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Гістологія — симулятор іспиту</h1>
  <div id="timer">Завантаження таймера...</div>
  <div id="block"></div>
  <div id="result">Поточний результат: 0% → Очінка: —</div>
</div>

<script>
// ==========================================
// БАЗА ДАНИХ (Сюди потім вставляй свої питання)
// ==========================================
const questionBank = [
  // Загальна гістологія (topics: ["general"])
  { id: "g1", text: "Клітини кісткової тканини (остеобласти, остеоцити, остеокласти). Хто що робить?", weight: 9, topics: ["general"] },
  { id: "g2", text: "Морфофункціональна характеристика та класифікація епітелію.", weight: 11, topics: ["general"] },

  // Спеціальна гістологія (topics: ["special"])
  { id: "s1", text: "Будова часточки печінки, тріади печінки та хід крові.", weight: 15, topics: ["special"] },
  { id: "s2", text: "Ендокринна частина підшлункової залози (острівці Лангерганса).", weight: 10, topics: ["special"] },

  // Препарати (topics: ["slides"])
  { id: "p1", text: "Мікропрепарат: Серце (пучок Пуркін'є, кардіоміоцити). На що звернути увагу?", weight: 10, topics: ["slides"] },
  { id: "p2", text: "Мікропрепарат: Легеня (альвеоли, бронхи різного калібру).", weight: 10, topics: ["slides"] }
];

// Налаштування блоків (час у секундах: 300 сек = 5 хвилин)
const blocksConfig = [
  { id: "general", name: "Блок 1: Загальна гістологія", duration: 300 },
  { id: "special", name: "Блок 2: Спеціальна гістологія", duration: 300 },
  { id: "slides", name: "Блок 3: Мікропрепарати", duration: 300 }
];

// ==========================================
// ЛОГІКА ДОДАТКУ (Двигун симулятора)
// ==========================================
let state = {
  blocks: [],
  currentBlock: 0,
  answers: {},
  timeLeft: 0,
  timer: null
};

function init() {
  state.blocks = buildBlocks();
  startBlock(0);
}

function buildBlocks() {
  return blocksConfig.map(block => {
    const filtered = questionBank.filter(q => q.topics.includes(block.id));
    return {
      ...block,
      questions: shuffle([...filtered]) // Рандомізація порядку всередині блоку
    };
  });
}

function startBlock(index) {
  state.currentBlock = index;
  state.timeLeft = state.blocks[index].duration;
  render();
  
  clearInterval(state.timer);
  state.timer = setInterval(() => {
    state.timeLeft--;
    updateTimer();
    if (state.timeLeft <= 0) {
      nextBlock();
    }
  }, 1000);
  updateTimer();
}

function render() {
  const block = state.blocks[state.currentBlock];
  let html = `<h2>${block.name}</h2>`;
  
  block.questions.forEach(q => {
    const currentAns = state.answers[q.id];
    
    html += `
      <div class="question">
        <p><strong>${q.text}</strong> <span style="color:#aaa;">(Вага: ${q.weight}%)</span></p>
        <div class="btn-group">
          <button class="${currentAns === 0 ? 'active-0' : ''}" onclick="answer('${q.id}', 0)">Не відповів (-)</button>
          <button class="${currentAns === 0.5 ? 'active-05' : ''}" onclick="answer('${q.id}', 0.5)">Частково (½)</button>
          <button class="${currentAns === 1 ? 'active-1' : ''}" onclick="answer('${q.id}', 1)">Повністю (+)</button>
        </div>
      </div>
    `;
  });
  
  const isLast = state.currentBlock === state.blocks.length - 1;
  html += `<button class="nav-btn" onclick="nextBlock()">${isLast ? 'Завершити іспит' : 'Перейти до наступного блоку'}</button>`;
  
  document.getElementById("block").innerHTML = html;
}

function answer(id, val) {
  state.answers[id] = val;
  render(); // перерендер для оновлення підсвітки кнопок
  calculate();
}

function calculate() {
  let total = 0;
  let max = 0;

  questionBank.forEach(q => {
    const v = state.answers[q.id] !== undefined ? state.answers[q.id] : 0;
    total += v * q.weight;
    max += q.weight;
  });

  const percent = max > 0 ? Math.round((total / max) * 100) : 0;

  let grade = 2;
  if (percent >= 50 && percent < 75) grade = 3;
  else if (percent >= 75 && percent < 90) grade = 4;
  else if (percent >= 90) grade = 5;

  let color = "#ee5253";
  if (grade === 3) color = "#feca57";
  if (grade >= 4) color = "#10ac84";

  document.getElementById("result").innerHTML = `
    Поточний загальний результат: <strong style="color:${color};">${percent}%</strong> → Оцінка: <strong style="color:${color};">${grade}</strong>
  `;

  localStorage.setItem("histology_exam_res", JSON.stringify({ percent, grade }));
}

function updateTimer() {
  const m = Math.floor(state.timeLeft / 60);
  const s = state.timeLeft % 60;
  document.getElementById("timer").innerText = `Залишилось часу на блок: ${m}:${s.toString().padStart(2, '0')}`;
}

function nextBlock() {
  if (state.currentBlock < state.blocks.length - 1) {
    startBlock(state.currentBlock + 1);
  } else {
    clearInterval(state.timer);
    document.getElementById("block").innerHTML = "<h2 style='text-align:center; color:#10ac84;'>Іспит завершено! Привітання кафедрі!</h2>";
    document.getElementById("timer").style.display = "none";
    calculate(); // Фінальний розрахунок
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Запуск
init();
</script>

</body>
</html>
