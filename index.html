<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гістологія — Іспит та Симуляція</title>
  <style>
    body {
      background: #111116;
      color: #eee;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #16161a;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 {
      color: #ff9f43;
      text-align: center;
      margin-bottom: 5px;
    }
    h2 {
      color: #00ff99;
      border-bottom: 2px solid #3e3e4a;
      padding-bottom: 8px;
      margin-top: 25px;
    }
    #timer {
      background: #1e1e24;
      color: #ff4d4d;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 20px;
      border: 1px solid #ff4d4d;
    }
    .main-menu-btn, .nav-btn {
      background: #282833;
      color: #ff9f43;
      border: 1px solid #ff9f43;
      padding: 12px 24px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      margin-bottom: 15px;
      display: inline-block;
    }
    .main-menu-btn:hover, .nav-btn:hover {
      background: #ff9f43;
      color: #16161a;
    }
    .nav-btn {
      background: #00ff99;
      color: #111;
      border: 1px solid #00ff99;
      margin-top: 25px;
      width: 100%;
    }
    .nav-btn:hover {
      background: #02cc7a;
      color: #fff;
    }
    .block-select-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
    }
    .block-btn {
      padding: 20px;
      font-size: 18px;
      background: #1e1e24;
      border: 2px solid #3e3e4a;
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      font-weight: bold;
    }
    .block-btn:hover {
      border-color: #00ff99;
      background: #24242e;
    }
    .block-btn span {
      display: block;
      font-size: 14px;
      color: #aaa;
      margin-top: 5px;
      font-weight: normal;
    }
    .topic-title {
      background: #1e1e24;
      padding: 15px;
      border-left: 4px solid #ff9f43;
      margin-bottom: 20px;
      border-radius: 0 6px 6px 0;
      font-size: 16px;
    }
    .question {
      background: #1e1e24;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid #2d2d38;
    }
    .question p {
      margin-top: 0;
      font-size: 16px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .btn-group button {
      flex: 1;
      min-width: 150px;
      padding: 10px;
      background: #282833;
      border: 1px solid #444;
      color: #ccc;
      cursor: pointer;
      border-radius: 5px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-group button.active-1 {
      background: #10ac84 !important;
      color: #fff !important;
      border-color: #10ac84;
    }
    .btn-group button.active-05 {
      background: #ff9f43 !important;
      color: #fff !important;
      border-color: #ff9f43;
    }
    .btn-group button.active-0 {
      background: #ee5253 !important;
      color: #fff !important;
      border-color: #ee5253;
    }
    .final-score-row {
      display: flex;
      justify-content: space-between;
      background: #22222b;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid #3e3e4a;
      font-size: 18px;
    }
    .good-grade { color: #10ac84; font-weight: bold; }
    .normal-grade { color: #ff9f43; font-weight: bold; }
    .bad-grade { color: #ee5253; font-weight: bold; }
    ul { padding-left: 20px; }
    li { margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Гістологія — Екзаменаційна Симуляція</h1>
  <div id="timer" style="display:none;">Залишилось часу: --:--</div>
  <div id="block"></div>
  <div id="summary-report"></div>
</div>

<script>
// ВЕЛИКА БАЗА ДАНИХ (БЛОКИ ПИТАНЬ)

const specialHistologyTopics = [
  {
    name: "Тема 2: Органи кровотворення та імунного захисту (Селезінка)",
    questions: [
      { id: "s2_6", text: "Лімфоїдний фолікул селезінки: назвати чотири зони, судини крайової зони та переважаючий тип лімфоцитів.", points: 25 },
      { id: "s2_7", text: "Характеристика червоної пульпи селезінки: забарвлення при H&E, причина та її основні компоненти.", points: 15 },
      { id: "s2_8", text: "Назвати 5 типів клітин, що входять до клітинного складу тяжів Більрота.", points: 20 },
      { id: "s2_9", text: "Особливості будови венозних синусів селезінки: форма та орієнтація ендотеліоцитів, особливості базальної мембрани та функціональне значення цієї структури.", points: 30 }
    ]
  },
  {
    name: "Тема 7: Ендокринна система (Гіпофіз)",
    questions: [
      { id: "s7_2", text: "Назвати три структурні частини аденогіпофіза.", points: 15 },
      { id: "s7_3", text: "Загальна будова аденогіпофіза (строма, паренхіма) та на які групи за тинкторіальними властивостями поділяються його ендокриноцити?", points: 20 },
      { id: "s7_4", text: "Як називаються опорні клітини аденогіпофіза?", points: 10 },
      { id: "s7_5", text: "Назвати три типу базофільних аденоцитів та гормони, які вони секретують.", points: 20 },
      { id: "s7_6", text: "Назвати два типи ацидофільних аденоцитів та їхні гормони.", points: 15 },
      { id: "s7_7", text: "Морфологічні особливості проміжної та туберальної частин аденогіпофіза.", points: 15 },
      { id: "s7_8", text: "Структурні частини нейрогіпофіза, його стромальні елементи та характер паренхіми.", points: 20 }
    ]
  },
  {
    name: "Тема 8: Центральні органи кровотворення (Тимус)",
    questions: [
      { id: "s8_1", text: "Яка основна функція тимуса та з яких попередників вона здійснюється?", points: 15 },
      { id: "s8_2", text: "Характеристика грубої та ніжної строми тимуса (типи клітин, походження, кількість типів клітин ніжної строми).", points: 20 },
      { id: "s8_3", text: "Назвати структурно-функціональну одиницю тимуса, її зони та клітинний склад кіркової речовини.", points: 20 },
      { id: "s8_4", text: "Перерахувати всі компоненти гематотимусного бар'єру та назвати три його основні функції.", points: 25 },
      { id: "s8_5", text: "Клітинний склад мозкової речовини тимуса, особливості рециркуляції Т-лімфоцитів та де саме і чому вони виходять у судинне русло?", points: 25 },
      { id: "s8_6", text: "Назвати три стадії диференціації Т-клітин за наявністю рецепторів CD4/CD8.", points: 15 }
    ]
  }
];

const generalHistologyTopics = [
  {
    name: "Тема 2: Морфофункциональна характеристика кісткової тканини",
    questions: [
      { id: "g2_1", text: "Три типи клітин та загальні характеристики міжклітинної речовини (органічна і неорганічна частини).", points: 25 },
      { id: "g2_2", text: "Характеристика остеобласта: локалізація, будова, забарвлення цитоплазми та функція.", points: 20 },
      { id: "g2_3", text: "Характеристика остеоцита: локалізація, форма клітини, функція.", points: 15 },
      { id: "g2_4", text: "Характеристика остеокласта: локалізація, походження, будова та функція.", points: 25 }
    ]
  },
  {
    name: "Тема 4: М'язові тканини",
    questions: [
      { id: "g4_3", text: "Міофібрила: функція, вигляд на препараті (причина посмугованості) та її одиниця.", points: 20 },
      { id: "g4_4", text: "Саркомер та його елементи: типи скоротливих міофіламентів та 5 основних елементів саркомера.", points: 30 },
      { id: "g4_5", text: "Характеристика А-диска та І-диска: забарвлення та склад філаментів.", points: 20 },
      { id: "g4_6", text: "Білки, асоційовані з актином: білок для зв'язування кальцію та білок, що закриває активні ділянки.", points: 15 },
      { id: "g4_7", text: "Саркоплазматична сітка та Т-система: поняття L-системи, її функція та склад тріади.", points: 25 },
      { id: "g4_8", text: "Функціональні особливості: тип інервації, швидкість, характер скорочень та стомлюваність.", points: 15 }
    ]
  },
  {
    name: "Тема 11: Морфофункціональна характеристика епітеліальної тканини",
    questions: [
      { id: "g11_1", text: "Чотири основні функції епітеліальної тканини з конкретними прикладами.", points: 25 },
      { id: "g11_2", text: "Головні морфологічні ознаки епітеліїв (полярність, базальна мембрана, відсутність судин).", points: 25 },
      { id: "g11_3", text: "Морфологічна класифікація покривного епітелію.", points: 20 },
      { id: "g11_4", text: "Будова та локалізація перехідного епітелію (уротелію).", points: 15 }
    ]
  }
];

const slideTopics = [
  {
    name: "Препарат 1: Стінка серця (волокна Пуркін'є)",
    questions: [
      { id: "p1_1", text: "Надайте морфологічну характеристику препарату. Назвіть забарвлення ядер (метод H&E).", points: 15 },
      { id: "p1_2", text: "Перерахуйте у правильній послідовності всі 4 шари ендокарду.", points: 20 },
      { id: "p1_3", text: "Волокна Пуркін'є: вкажіть тип кардіоміоцитів, розмір клітин, кількість і розташування міофібрил.", points: 25 },
      { id: "p1_4", text: "Волокна Пуркін'є: яке забарвлення має цитоплазма (H&E), які включення містяться у великій кількості і чому вони не візуалізуються?", points: 25 },
      { id: "p1_5", text: "Які клітини розташовані праворуч і ліворуч від волокон (виглядають як порожні «персні»)? Вкажіть тканинний склад міокарда.", points: 15 }
    ]
  },
  {
    name: "Препарат 4: Лімфатичний вузол",
    questions: [
      { id: "p4_1", text: "Опишіть грубу строму органа, структуру-просвітлення під капсулою та ніжну строму.", points: 15 },
      { id: "p4_2", text: "Кіркова речовина: назвіть дві частини (Частина 1 і Частина 2), їхній вигляд на препараті та переважаючий тип лімфоцитів у Частині 2.", points: 25 },
      { id: "p4_3", text: "Лімфоїдні фолікули: який тип лімфоцитів переважає, який це вид фолікулів на препараті?", points: 15 },
      { id: "p4_4", text: "Опишіть 2 зони лімфоїдного фолікула та особливості їхнього забарвлення.", points: 25 },
      { id: "p4_5", text: "Мозкова речовина: назвіть та охарактеризуйте два її головні компоненти.", points: 20 }
    ]
  },
  {
    name: "Препарат 9: Сечовий міхур",
    questions: [
      { id: "p9_1", text: "Перерахуйте всі оболонки стінки сечового міхура. З яких шарів складається слизова оболонка?", points: 20 },
      { id: "p9_2", text: "Назвіть структури рельєфу слизової оболонки. Опишіть шари уротелію (базальний, проміжний, поверхневий).", points: 25 },
      { id: "p9_3", text: "Чому епітелій сечового міхура називають перехідним? Опишіть механізм.", points: 15 },
      { id: "p9_4", text: "М'язова оболонка: тип тканини, забарвлення цитоплазми. Вкажіть тканину прошарків та структури в них.", points: 20 }
    ]
  }
];

// ГЛОБАЛЬНИЙ СТАН СИМУЛЯТОРА
let currentBlock = null; 
let currentQuestions = [];
let userAnswers = {}; 
let timerInterval = null;
let timeLeft = 0; 
let totalExamPoints = 0;

window.onload = function() {
  showBlockSelection();
};

function showBlockSelection() {
  currentBlock = null;
  clearInterval(timerInterval);
  document.getElementById('timer').style.display = 'none';
  document.getElementById('summary-report').innerHTML = '';
  
  let html = `
    <div class="topic-title" style="text-align:center; font-weight:bold; color:#ff9f43; border-left:none;">
      ОБЕРІТЬ ЕКЗАМЕНАЦІЙНИЙ БЛОК ДЛЯ СИМУЛЯЦІЇ
    </div>
    <div class="block-select-container">
      <button class="block-btn" onclick="startExamBlock(1)">
        БЛОК 1: СПЕЦІАЛЬНА ГІСТОЛОГІЯ
        <span>Включає комплексні теми (селезінка, гіпофіз, тимус тощо)</span>
      </button>
      <button class="block-btn" onclick="startExamBlock(2)">
        БЛОК 2: ЗАГАЛЬНА ГІСТОЛОГІЯ
        <span>Включає теми базових структур (кісткова, м'язова, епітеліальна тканини)</span>
      </button>
      <button class="block-btn" onclick="startExamBlock(3)">
        БЛОК 3: ГІСТОЛОГІЧНІ ПРЕПАРАТИ (МІКРОСТРУКТУРА)
        <span>Аналіз екзаменаційних мікропрепаратів (серце, лімфовузол, сечовий міхур)</span>
      </button>
    </div>
  `;
  document.getElementById('block').innerHTML = html;
}

function startExamBlock(blockNum) {
  currentBlock = blockNum;
  userAnswers = {};
  totalExamPoints = 0;
  
  let selectedTopics = [];
  if (blockNum === 1) {
    selectedTopics = specialHistologyTopics;
    timeLeft = 45 * 60; 
  } else if (blockNum === 2) {
    selectedTopics = generalHistologyTopics;
    timeLeft = 35 * 60; 
  } else if (blockNum === 3) {
    selectedTopics = slideTopics;
    timeLeft = 45 * 60; 
  }
  
  // Компіляція рандомного квитка або набору тем
  currentQuestions = [];
  selectedTopics.forEach(topic => {
    topic.questions.forEach(q => {
      currentQuestions.push({
        id: q.id,
        text: q.text,
        points: q.points,
        topicName: topic.name
      });
      totalExamPoints += q.points;
      userAnswers[q.id] = null; 
    });
  });
  
  document.getElementById('timer').style.display = 'block';
  updateTimerDisplay();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      alert("Час вичерпано! Автоматичне формування протоколу.");
      finishExam();
    }
  }, 1000);
  
  renderQuestions();
}

function updateTimerDisplay() {
  let min = Math.floor(timeLeft / 60);
  let sec = timeLeft % 60;
  document.getElementById('timer').innerText = `Залишилось часу: ${min}:${sec < 10 ? '0' : ''}${sec}`;
}

function renderQuestions() {
  let html = `<button class="main-menu-btn" onclick="showBlockSelection()">← Повернутися до меню</button>`;
  let currentTopic = "";

  currentQuestions.forEach((q, index) => {
    if (currentTopic !== q.topicName) {
      currentTopic = q.topicName;
      html += `<h2>${currentTopic}</h2>`;
    }
    
    let active1 = userAnswers[q.id] === 1 ? "active-1" : "";
    let active05 = userAnswers[q.id] === 0.5 ? "active-05" : "";
    let active0 = userAnswers[q.id] === 0 ? "active-0" : "";
    
    html += `
      <div class="question" id="q_container_${q.id}">
        <p><strong>Питання ${index + 1} [Бали: ${q.points}]:</strong> ${q.text}</p>
        <div class="btn-group">
          <button class="${active1}" onclick="setAnswer('${q.id}', 1)">Повна правильна відповідь (100%)</button>
          <button class="${active05}" onclick="setAnswer('${q.id}', 0.5)">Часткова відповідь (50%)</button>
          <button class="${active0}" onclick="setAnswer('${q.id}', 0)">Неправильна відповідь / Не знаю (0%)</button>
        </div>
      </div>
    `;
  });
  
  html += `<button class="nav-btn" onclick="finishExam()">ЗАВЕРШИТИ ІСПИТ ТА СФОРМУВАТИ ПРОТОКОЛ</button>`;
  document.getElementById('block').innerHTML = html;
  window.scrollTo(0, 0);
}

function setAnswer(qId, val) {
  userAnswers[qId] = val;
  let container = document.getElementById(`q_container_${qId}`);
  let btns = container.getElementsByTagName('button');
  
  btns[0].className = val === 1 ? "active-1" : "";
  btns[1].className = val === 0.5 ? "active-05" : "";
  btns[2].className = val === 0 ? "active-0" : "";
}

function finishExam() {
  clearInterval(timerInterval);
  document.getElementById('timer').style.display = 'none';
  document.getElementById('block').innerHTML = '';

  let earnedPoints = 0;
  let correctCount = 0;
  let partialCount = 0;
  let incorrectCount = 0;
  let unansweredCount = 0;

  currentQuestions.forEach(q => {
    let status = userAnswers[q.id];
    if (status === 1) {
      earnedPoints += q.points;
      correctCount++;
    } else if (status === 0.5) {
      earnedPoints += (q.points * 0.5);
      partialCount++;
    } else if (status === 0) {
      incorrectCount++;
    } else {
      unansweredCount++;
    }
  });

  let percentage = (earnedPoints / totalExamPoints) * 100;
  if(totalExamPoints === 0) percentage = 0;
  
  let grade5 = 2;
  let gradeEcts = "F";
  let gradeStyle = "bad-grade";

  if (percentage >= 90) { grade5 = 5; gradeEcts = "A"; gradeStyle = "good-grade"; }
  else if (percentage >= 85) { grade5 = 4; gradeEcts = "B"; gradeStyle = "good-grade"; }
  else if (percentage >= 75) { grade5 = 4; gradeEcts = "C"; gradeStyle = "good-grade"; }
  else if (percentage >= 65) { grade5 = 3; gradeEcts = "D"; gradeStyle = "normal-grade"; }
  else if (percentage >= 60) { grade5 = 3; gradeEcts = "E"; gradeStyle = "normal-grade"; }
  else if (percentage >= 35) { grade5 = 2; gradeEcts = "FX"; gradeStyle = "bad-grade"; }

  let reportHtml = `
    <button class="main-menu-btn" onclick="showBlockSelection()">← Новий іспит</button>
    <div class="topic-title" style="text-align:center; font-weight:bold; color:#fff; font-size:22px; border-left:none; background:#222230;">
      ОФІЦІЙНИЙ ВІДОМОСТІВ-РЕЄСТРАЦІЙНИЙ ПРОТОКОЛ (БЛОК ${currentBlock})
    </div>
    
    <div class="final-score-row">
      <div>
        <strong>Рейтинговий бал:</strong> <span class="${gradeStyle}">${earnedPoints.toFixed(1)} / ${totalExamPoints}</span> 
        <span style="font-size:16px; color:#aaa;">(${percentage.toFixed(1)}%)</span>
      </div>
      <div>
        <strong>Оцінка:</strong> <span class="${gradeStyle}">${grade5} (${gradeEcts})</span>
      </div>
    </div>
    
    <h3 style="margin-top:25px; color:#ff9f43;">Статистичний розподіл відповідей:</h3>
    <ul>
      <li>Повних правильних відповідей (100% балів): <strong style="color:#10ac84;">${correctCount}</strong></li>
      <li>Часткових відповідей (50% балів): <strong style="color:#ff9f43;">${partialCount}</strong></li>
      <li>Неправильних відповідей (0% балів): <strong style="color:#ee5253;">${incorrectCount}</strong></li>
      <li>Залишено без відповіді: <strong>${unansweredCount}</strong></li>
    </ul>
  `;
  document.getElementById('summary-report').innerHTML = reportHtml;
}
</script>
</body>
</html>
