    }

      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
      background: #32323e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      font-weight: 600;
      transition: all 0.2s;
    }

      background: #454556;
    }

    button.active-05 { background: #feca57 !important; border-color: #ffff66; color: #000; }
    button.active-1 { background: #10ac84 !important; border-color: #1dd1a1; }

      background: #0052cc;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      width: 100%;
      border-radius: 8px;
      color: white;
      font-weight: bold;
    }
    .nav-btn:hover {
      background: #0066ff;
    }
    
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #1e1e24;
      border-radius: 8px;
      overflow: hidden;
    }
    .results-table th, .results-table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    .results-table th {
      background: #2a2a35;
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
    }
    .bad-grade { color: #ee5253; font-weight: bold; }
    .normal-grade { color: #feca57; font-weight: bold; }
    .good-grade { color: #10ac84; font-weight: bold; }

      margin-top: 25px;
      padding: 20px;

    name: "Тема 9: Морфофункціональна характеристика пухкої сполучної тканини",
    questions: [
      { id: "g9_1", text: "Перерахувати сім основних функцій пухкої сполучної тканини.", points: 20 },
      { id: "g9_2", text: "Три визначальні риси пухкої сполучної тканини як тканинної групи.", points: 15 },
      { id: "g9_3", text: "Групи клітин за ознакою присутності (2 групи) та за походженням (3 лінії з прикладами).", points: 25 },
      { id: "g9_4", text: "Будова зрілого фібробласта: форма, розмір, ядро, розвиток органел та три основні функції клітини.", points: 30 },
      { id: "g9_5", text: "Типи волокон (3 типи) та детальна характеристика колагенових волокон (властивості, морфологія, тинкторіальність, періодичність).", points: 30 },
      { id: "g9_6", text: "Три типи органічних речовин, що формують аморфну (основну) речовину пухкої сполучної тканини.", points: 15 }
    ]
  },
  {
    name: "Тема 10: Морфофункціональна характеристика цитоскелета",
    questions: [
      { id: "g10_1", text: "Три основні компоненти цитоскелета.", points: 15 },
      { id: "g10_2", text: "Тонкі мікрофіламенти: діаметр, основний білок, динамічність, переважна локалізація та 5 функцій.", points: 30 },
      { id: "g10_3", text: "Проміжні філаменти: діаметр, стабільність, локалізація, шість тканеспецифічних різновидів та п’ять основних функцій.", points: 35 },
      { id: "g10_4", text: "Мікротрубочки: діаметр, білок, динаміка збирання, локалізація у клітині та чотири головні функції.", points: 30 }
    ]
  },
  {
    name: "Тема 11: Морфофункціональна характеристика епітеліальної тканини",
    questions: [
      { id: "g11_1", text: "Чотири основні функції епітеліальної тканини з конкретними прикладами.", points: 25 },
      { id: "g11_2", text: "П'ять визначальних рис (критеріїв) епітеліальної тканини.", points: 25 },
      { id: "g11_3", text: "Міжклітинні контакти на латеральній поверхні епітеліоцитів: 4 типи та їхнє функціональне призначення.", points: 30 },
      { id: "g11_4", text: "Спеціалізовані структури апікальної поверхні (мікроворсинки та війки): компоненти цитоскелета, функції та приклади локалізації.", points: 30 },
      { id: "g11_5", text: "Структури базального полюса епітеліоцита: позаклітинна структура та тип контакту, їхнє значення.", points: 20 }
    ]
  }
];

// БЛОК 3: ПРЕПАРАТЫ
const slideQuestions = [
  { id: "p1", text: "Діагностика мікропрепарату: Серце (пучок Пуркін'є, кардіоміоцити). На що звернути увагу?", points: 100 }
];

const blocksConfig = [
  { id: "special", name: "1. Спеціальна гістологія", duration: 1200 },
  { id: "general", name: "2. Загальна гістологія", duration: 1200 },
  { id: "slides", name: "3. Завдання 3. Діагностика мікропрепарата", duration: 600 }
];

// ==========================================
// ДВИЖОК ТЕСТА
// ==========================================
let state = {
  blocks: [],
  currentBlockIndex: 0,
  answers: {},
  timeLeft: 0,
  timer: null,
  selectedSpecialTopic: null, // Рандомная тема Специальной гистологии
  selectedGeneralTopic: null   // Рандомная тема Общей гистологии
};

function init() {
  // Рандомный выбор тем при запуске
  const randSpecialIdx = Math.floor(Math.random() * specialHistologyTopics.length);
  state.selectedSpecialTopic = specialHistologyTopics[randSpecialIdx];

  const randGeneralIdx = Math.floor(Math.random() * generalHistologyTopics.length);
  state.selectedGeneralTopic = generalHistologyTopics[randGeneralIdx];

  state.blocks = blocksConfig.map(b => {
    let qList = [];
    if (b.id === "special") qList = state.selectedSpecialTopic.questions;
    if (b.id === "general") qList = state.selectedGeneralTopic.questions;
    if (b.id === "slides") qList = slideQuestions;
    
    return { ...b, questions: qList };
  });

  startBlock(0);
}

function startBlock(index) {
  state.currentBlockIndex = index;
  state.timeLeft = state.blocks[index].duration;
  render();
  
  clearInterval(state.timer);
  state.timer = setInterval(() => {
    state.timeLeft--;
    updateTimer();
    if (state.timeLeft <= 0) {
      nextBlock();
    }
  }, 1000);
  updateTimer();
}

function updateTimer() {
  const m = Math.floor(state.timeLeft / 60);
  const s = state.timeLeft % 60;
  document.getElementById("timer").innerText = `Залишилось часу на поточний блок: ${m}:${s.toString().padStart(2, '0')}`;
}

function render() {
  const block = state.blocks[state.currentBlockIndex];
  let html = `<h2>Поточний етап: ${block.name}</h2>`;
  
  if (block.id === "special") {
    html += `<div class="topic-title"><strong>Випадковий білет:</strong> ${state.selectedSpecialTopic.name}</div>`;
  } else if (block.id === "general") {
    html += `<div class="topic-title"><strong>Випадковий білет:</strong> ${state.selectedGeneralTopic.name}</div>`;
  }
  
  block.questions.forEach((q, i) => {
    const currentAns = state.answers[q.id];
    html += `
      <div class="question">
        <p><strong>№ ${i+1}. ${q.text}</strong></p>
        <div class="btn-group">
          <button class="${currentAns === 0 ? 'active-0' : ''}" onclick="setAnswer('${q.id}', 0)">0 (Не знав)</button>
          <button class="${currentAns === 0.5 ? 'active-05' : ''}" onclick="setAnswer('${q.id}', 0.5)">0.5 (Частково)</button>
          <button class="${currentAns === 1 ? 'active-1' : ''}" onclick="setAnswer('${q.id}', 1)">1.0 (Повністю)</button>
        </div>
      </div>
    `;
  });
  
  const isLast = state.currentBlockIndex === state.blocks.length - 1;
  html += `<button class="nav-btn" onclick="nextBlock()">${isLast ? 'Завершити іспит та вивести результати' : 'Зберегти та перейти до наступного блоку'}</button>`;
  
  document.getElementById("block").innerHTML = html;
  window.scrollTo(0, 0);
}

function setAnswer(id, value) {
  state.answers[id] = value;
  render();
}

function nextBlock() {
  if (state.currentBlockIndex < state.blocks.length - 1) {
    startBlock(state.currentBlockIndex + 1);
  } else {
    finishExam();
  }
}

function finishExam() {
  clearInterval(state.timer);
  document.getElementById("timer").style.display = "none";
  document.getElementById("block").style.display = "none";
  
  let tableRowsHtml = "";
  let totalEarned200 = 0;
  
  blocksConfig.forEach(bConfig => {
    let blockQuestions = [];
    if (bConfig.id === "special") blockQuestions = state.selectedSpecialTopic.questions;
    if (bConfig.id === "general") blockQuestions = state.selectedGeneralTopic.questions;
    if (bConfig.id === "slides") blockQuestions = slideQuestions;

    let maxBlockPoints = 0;
    let earnedBlockPoints = 0;
    
    blockQuestions.forEach(q => {
      const coeff = state.answers[q.id] !== undefined ? state.answers[q.id] : 0;
      earnedBlockPoints += coeff * q.points;
      maxBlockPoints += q.points;
    });
    
    const percent = maxBlockPoints > 0 ? Math.round((earnedBlockPoints / maxBlockPoints) * 1000) / 10 : 0;
    const points200 = Math.round((percent / 100) * 200 * 100) / 100;
    
    let grade4 = 2;
    let gradeClass = "bad-grade";
    if (percent >= 50 && percent < 75) { grade4 = 3; gradeClass = "normal-grade"; }
    else if (percent >= 75 && percent < 90) { grade4 = 4; gradeClass = "good-grade"; }
    else if (percent >= 90) { grade4 = 5; gradeClass = "good-grade"; }
    
    totalEarned200 += points200;
    
    let displayedName = "";
    if(bConfig.id === "special") displayedName = `Спеціальна гістологія (${state.selectedSpecialTopic.name.split(':')[0]})`;
    if(bConfig.id === "general") displayedName = `Загальна гістологія (${state.selectedGeneralTopic.name.split(':')[0]})`;
    if(bConfig.id === "slides") displayedName = "Завдання 3. Діагностика мікропрепарата";

    tableRowsHtml += `
      <tr>
        <td>${displayedName}</td>
        <td class="${gradeClass}">${percent}%</td>
        <td class="${gradeClass}">${points200}</td>
        <td class="${gradeClass}">${grade4}</td>
      </tr>
    `;
  });
  
  const finalPoints200 = Math.round((totalEarned200 / 3) * 100) / 100;
  const finalPercent = Math.round((finalPoints200 / 200) * 1000) / 10;
  
  let finalGrade4 = 2;
  let finalClass = "bad-grade";
  if (finalPercent >= 50 && finalPercent < 75) { finalGrade4 = 3; finalClass = "normal-grade"; }
  else if (finalPercent >= 75 && finalPercent < 90) { finalGrade4 = 4; finalClass = "good-grade"; }
  else if (finalPercent >= 90) { finalGrade4 = 5; finalClass = "good-grade"; }
  
  let reportHtml = `
    <h2>Результати іспиту</h2>
    <table class="results-table">
      <thead>
        <tr>
          <th>Завдання</th>
          <th>%</th>
          <th>200-бальна оцінка</th>
          <th>4-бальна оцінка</th>
        </tr>
      </thead>
      <tbody>
        ${tableRowsHtml}
      </tbody>
    </table>
    
    <div class="final-score-row">
      <span><strong>Итоговая оценка</strong></span>
      <span>
        <span class="${finalClass}" style="margin-right:20px;">${finalPercent}%</span>
        <span class="${finalClass}" style="margin-right:20px;">${finalPoints200}/200</span>
        <span class="${finalClass}" style="font-size:26px;">${finalGrade4}</span>
      </span>
    </div>
    <p style="text-align:center; color:#aaa; margin-top:30px;">The exam is finished</p>
  `;
  
  document.getElementById("summary-report").innerHTML = reportHtml;
}

init();
</script>

</body>
</html>
