<!DOCTYPE html>

<head>

    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --error: #dc2626;
            --warning: #ca8a04;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-top: 20px;
            position: relative;
        }

        .timer-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 9999px;
            height: 12px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: var(--success);
            transition: width 1s linear, background-color 0.5s ease;
        }

        .timer-text {
            font-size: 1rem;
            font-weight: 600;
            text-align: right;
            margin-bottom: 20px;
            color: var(--text);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .ticket-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
            max-width: 75%;
        }

        .score {
            font-weight: 600;
            background: #dbeafe;
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--primary);
            white-space: nowrap;
        }

        .question {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            padding: 16px;
            text-align: left;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: #e2e8f0;
            border-color: #cbd5e1;
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d !important;
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #7f1d1d !important;
            font-weight: 600;
        }

        .nav-btn {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            float: right;
        }

        .summary-card {
            text-align: center;
            padding: 40px;
        }

        .restart-btn {
            padding: 12px 24px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 20px;
        }
    </style>
</head>

        options: ["Мультиполярні нейрони", "Псевдоуніполярні нейрони", "Біполярні нейрони", "Уніполярні нейрони"],

let currentQuestionIndex = 0;
let score = 0;
let timer;
let timeLeft = 300; 

function loadQuestion() {
    resetTimer();
    const currentQuestion = quizData[currentQuestionIndex];
    
    document.getElementById("ticket-info").innerText = currentQuestion.ticket;
    document.getElementById("question-text").innerText = currentQuestion.question;
    document.getElementById("score-counter").innerText = `Бали: ${score}`;
    
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";
    
    currentQuestion.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.innerText = option;
        button.classList.add("option-btn");
        button.onclick = () => selectOption(index, button);
        optionsContainer.appendChild(button);
    });
    
    document.getElementById("next-btn").style.display = "none";
    startTimer();
}

function startTimer() {
    const timerBar = document.getElementById("timer-bar");
    const timerText = document.getElementById("timer-text");
    
    timer = setInterval(() => {
        timeLeft--;
        
        const percentage = (timeLeft / 300) * 100;
        timerBar.style.width = `${percentage}%`;
        
        if (percentage > 50) {
            timerBar.style.backgroundColor = "var(--success)"; 
        } else if (percentage <= 50 && percentage > 20) {
            timerBar.style.backgroundColor = "var(--warning)"; 
        } else {
            timerBar.style.backgroundColor = "var(--error)"; 
        }

        const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const seconds = (timeLeft % 60).toString().padStart(2, '0');
        timerText.innerText = `Залишилось часу: ${minutes}:${seconds}`;
        
        if (timeLeft <= 0) {
            clearInterval(timer);
            autoTimeOut();
        }
    }, 1000);
}

function resetTimer() {
    clearInterval(timer);
    timeLeft = 300;
    document.getElementById("timer-bar").style.width = "100%";
    document.getElementById("timer-bar").style.backgroundColor = "var(--success)";
    document.getElementById("timer-text").innerText = "Залишилось часу: 05:00";
}

function selectOption(selectedIndex, selectedButton) {
    clearInterval(timer);
    const currentQuestion = quizData[currentQuestionIndex];
    const buttons = document.querySelectorAll(".option-btn");
    
    buttons.forEach((button, index) => {
        button.disabled = true; 
        if (index === currentQuestion.correct) {
            button.classList.add("correct"); 
        }
    });
    
    if (selectedIndex === currentQuestion.correct) {
        score++;
        document.getElementById("score-counter").innerText = `Бали: ${score}`;
    } else {
        selectedButton.classList.add("wrong"); 
    }
    
    document.getElementById("next-btn").style.display = "block";
}

function autoTimeOut() {
    const currentQuestion = quizData[currentQuestionIndex];
    const buttons = document.querySelectorAll(".option-btn");
    
    buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === currentQuestion.correct) {
            button.classList.add("correct");
        }
    });
    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < quizData.length) {
        loadQuestion();
    } else {
        showSummary();
    }
}

function showSummary() {
    const quizBox = document.getElementById("quiz-box");
    quizBox.innerHTML = `
        <div class="summary-card">
            <h2>Тестування завершено!</h2>
            <p style="font-size: 1.2rem;">Ваш результат: <strong>${score}</strong> з <strong>${quizData.length}</strong> правильних відповідей.</p>
            <p>Тепер ти повністю готовий розносити модулі з мікроскопії та системної гістології.</p>
            <button class="restart-btn" onclick="location.reload()">Пройти знову</button>
        </div>
    `;
}

window.onload = loadQuestion;
</script>
