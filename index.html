    .nav-btn:hover {
      background: #0066ff;
    }
    
    .results-table {

      margin-top: 20px;

      font-size: 12px;
      text-transform: uppercase;
    }

    .good-grade { color: #10ac84; font-weight: bold; }
    
    .final-score-row {
      font-size: 22px;
      margin-top: 25px;
      padding: 20px;
      background: #222230;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #444;
    }
  </style>
</head>
