<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Симулятор іспиту з гістології</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f11;
      color: #e5e5e7;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 25px;
      background: #16161a;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 {
      text-align: center;
      color: #ffffff;
      font-size: 26px;
      margin-bottom: 5px;
    }
    h2 {
      color: #ff9f43;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-top: 25px;
    }
    .block-header {
      background: #1e1e24;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid #ff9f43;
    }
    .block-header h3 {
      margin: 0 0 5px 0;
      color: #ff9f43;
    }
    .block-header p {
      margin: 0;
      color: #aaa;
      font-size: 14px;
    }
    .topic-title {
      background: #1e1e24;
      padding: 12px;
      border-radius: 6px;
      color: #00ff99;
      font-size: 18px;
      margin-bottom: 15px;
      border-left: 4px solid #00ff99;
    }
    #timer {
      font-size: 22px;
      text-align: center;
      margin: 15px 0;
      color: #00ff99;
      font-weight: bold;
      background: #1e1e24;
      padding: 10px;
      border-radius: 8px;
    }
    .question {
      background: #22222b;
      padding: 16px;
      margin: 15px 0;
      border-radius: 8px;
      border-left: 5px solid #0052cc;
    }
    .question p {
      margin: 0 0 12px 0;
      font-size: 16px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
      background: #32323e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      background: #454556;
    }
    button.active-0 { background: #ee5253 !important; border-color: #ff6b6b; }
    button.active-05 { background: #feca57 !important; border-color: #ffff66; color: #000; }
    button.active-1 { background: #10ac84 !important; border-color: #1dd1a1; }
    
    .nav-btn {
      margin-top: 25px;
      background: #0052cc;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      width: 100%;
      border-radius: 8px;
      color: white;
      font-weight: bold;
    }
    .nav-btn:hover {
      background: #0066ff;
    }
    
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #1e1e24;
      border-radius: 8px;
      overflow: hidden;
    }
    .results-table th, .results-table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    .results-table th {
      background: #2a2a35;
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
    }
    .bad-grade { color: #ee5253; font-weight: bold; }
    .normal-grade { color: #feca57; font-weight: bold; }
    .good-grade { color: #10ac84; font-weight: bold; }
    
    .final-score-row {
      font-size: 22px;
      margin-top: 25px;
      padding: 20px;
      background: #222230;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #444;
    }
    .block-result {
      background: #1e1e24;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid;
    }
    .block-result h4 {
      margin: 0 0 10px 0;
    }
    .summary-block {
      background: #2a2a35;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="header-area">
    <h1>Гістологія — Комплексний іспит</h1>
  </div>
  <div id="timer" style="display:none;">Завантаження таймера...</div>
  <div id="block"></div>
  <div id="summary-report"></div>
</div>

<script>
// ==========================================
// БЛОК 1: СПЕЦІАЛЬНА ГІСТОЛОГІЯ (15 ТЕМ)
// ==========================================
const specialHistologyTopics = [
  { name: "Морфофункціональна характеристика діоптричного апарату ока", questions: [] },
  { name: "Морфофункціональна характеристика селезінки", questions: [] },
  { name: "Морфофункціональна характеристика судин мікроциркуляторного русла", questions: [] },
  { name: "Морфофункціональна характеристика кори великих півкуль головного мозку", questions: [] },
  { name: "Морфофункціональна характеристика кіркових нефронів", questions: [] },
  { name: "Морфофункціональна характеристика печінки", questions: [] },
  { name: "Морфофункціональна характеристика гіпофіза", questions: [] },
  { name: "Морфофункціональна характеристика тимуса", questions: [] },
  { name: "Морфофункціональна характеристика та розвиток дентину", questions: [] },
  { name: "Морфофункціональна характеристика яєчника", questions: [] },
  { name: "Морфофункціональна характеристика матки", questions: [] },
  { name: "Морфофункціональна характеристика яєчка", questions: [] },
  { name: "Морфофункціональна характеристика стравоходу", questions: [] },
  { name: "Морфофункціональна характеристика тонкої кишки", questions: [] },
  { name: "Морфофункціональна характеристика респіраторного відділу легень", questions: [] }
];

// ==========================================
// БЛОК 2: ЗАГАЛЬНА ГІСТОЛОГІЯ (15 ТЕМ)
// ==========================================
const generalHistologyTopics = [
  { name: "Світлова мікроскопія як один з основних методів вивчення біологічних структур в гістології", questions: [] },
  { name: "Морфофункціональна характеристика кісткової тканини", questions: [] },
  { name: "Морфофункціональна характеристика хрящової тканини", questions: [] },
  { name: "Морфофункціональна характеристика скелетної м'язової тканини", questions: [] },
  { name: "Морфофункціональна характеристика гладкої м'язової тканини", questions: [] },
  { name: "Морфофункціональна характеристика нейрона", questions: [] },
  { name: "Морфофункціональна характеристика гранулярних лейкоцитів", questions: [] },
  { name: "Морфофункціональна характеристика серцевої м'язової тканини", questions: [] },
  { name: "Морфофункціональна характеристика пухкої сполучної тканини", questions: [] },
  { name: "Морфофункціональна характеристика цитоскелета", questions: [] },
  { name: "Морфофункціональна характеристика епітеліальної тканини", questions: [] },
  { name: "Морфофункціональна характеристика жирової тканини", questions: [] },
  { name: "Морфофункціональна характеристика хроматину", questions: [] },
  { name: "Запліднення: морфологічні передумови та основні стадії", questions: [] },
  { name: "Морфофункціональна характеристика клітин нейроглії", questions: [] }
];

// ==========================================
// БЛОК 3: ГІСТОЛОГІЧНІ ПРЕПАРАТИ (15 ТЕМ)
// ==========================================
const slideTopics = [
  { name: "Препарат 1: Стінка серця (волокна Пуркін'є)", questions: [] },
  { name: "Препарат 2: Щитоподібна та прищитоподібна залози", questions: [] },
  { name: "Препарат 3: Надниркова залоза", questions: [] },
  { name: "Препарат 4: Лімфатичний вузол", questions: [] },
  { name: "Препарат 5: Розвиток зуба", questions: [] },
  { name: "Препарат 6: Стравохід", questions: [] },
  { name: "Препарат 7: Товста кишка", questions: [] },
  { name: "Препарат 8: Підшлункова залоза", questions: [] },
  { name: "Препарат 9: Сечовий міхур", questions: [] },
  { name: "Препарат 10: Тимус (вилочкова залоза)", questions: [] },
  { name: "Препарат 11: Селезінка", questions: [] },
  { name: "Препарат 12: Трахея", questions: [] },
  { name: "Препарат 13: Губа", questions: [] },
  { name: "Препарат 14: Розвиток зуба (стадія дзвона)", questions: [] },
  { name: "Препарат 15: Розвиток кістки на місці сполучної тканини", questions: [] }
];

// Додаємо питання для спеціальної гістології (деякі теми)
specialHistologyTopics[0].questions = [
  { id: "s1_1", text: "Компоненти діоптричного апарату ока. Назвіть 4 компоненти", points: 12 },
  { id: "s1_2", text: "Шари рогівки. Назвіть 5 шарів", points: 15 },
  { id: "s1_3", text: "Морфологічна характеристика переднього епітелію рогівки", points: 3 },
  { id: "s1_4", text: "Тип і вид тканини власної речовини рогівки", points: 5 }
];

specialHistologyTopics[1].questions = [
  { id: "s2_1", text: "Функції селезінки. Перерахувати 5 функцій", points: 15 },
  { id: "s2_2", text: "Груба строма селезінки. Назвати 2 компоненти", points: 6 },
  { id: "s2_3", text: "Клітини грубої строми (окрім сполучнотканинних)", points: 3 }
];

// Додаємо питання для інших тем спеціальної гістології (заповнюємо)
for (let i = 2; i < specialHistologyTopics.length; i++) {
  specialHistologyTopics[i].questions = [
    { id: `s${i+1}_1`, text: `Питання 1 для теми "${specialHistologyTopics[i].name}"`, points: 10 },
    { id: `s${i+1}_2`, text: `Питання 2 для теми "${specialHistologyTopics[i].name}"`, points: 10 }
  ];
}

// Додаємо питання для загальної гістології (перші 3 теми для прикладу)
generalHistologyTopics[0].questions = [
  { id: "g1_1", text: "Частини, які входять до складу світлового мікроскопа. Назвіть 3 частини", points: 9 },
  { id: "g1_2", text: "Складові освітлювальної частини світлового мікроскопа. Назвіть 4 складові", points: 12 }
];

generalHistologyTopics[1].questions = [
  { id: "g2_1", text: "Клітини кісткової тканини. Назвіть 3 типи клітин", points: 9 },
  { id: "g2_2", text: "Міжклітинна речовина кісткової тканини. Вкажіть чим представлена органічна і неорганічна частини", points: 4 }
];

// Заповнюємо інші теми загальної гістології
for (let i = 2; i < generalHistologyTopics.length; i++) {
  generalHistologyTopics[i].questions = [
    { id: `g${i+1}_1`, text: `Питання 1 для теми "${generalHistologyTopics[i].name}"`, points: 10 },
    { id: `g${i+1}_2`, text: `Питання 2 для теми "${generalHistologyTopics[i].name}"`, points: 10 }
  ];
}

// Додаємо питання для препаратів
for (let i = 0; i < slideTopics.length; i++) {
  slideTopics[i].questions = [
    { id: `p${i+1}_1`, text: `Опишіть препарат: ${slideTopics[i].name}. Що видно?`, points: 15 },
    { id: `p${i+1}_2`, text: `Які структури діагностуються на даному препараті?`, points: 15 }
  ];
}

// ==========================================
// ГЛОБАЛЬНИЙ СТАН
// ==========================================
let currentBlockIndex = 1; // Починаємо з 1 (Спеціальна гістологія)
let blockResults = {
  1: { name: "Спеціальна гістологія", earned: 0, total: 0, answers: [], questions: [], topicName: "" },
  2: { name: "Загальна гістологія", earned: 0, total: 0, answers: [], questions: [], topicName: "" },
  3: { name: "Гістологічні препарати", earned: 0, total: 0, answers: [], questions: [], topicName: "" }
};

let currentQuestions = [];
let currentTopicInfo = null;
let userAnswers = {}; 
let timerInterval = null;
let timeLeft = 0; 

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getRandomTopic(blockNum) {
  let topics = [];
  if (blockNum === 1) topics = specialHistologyTopics;
  else if (blockNum === 2) topics = generalHistologyTopics;
  else topics = slideTopics;
  
  const randomIndex = Math.floor(Math.random() * topics.length);
  const selectedTopic = topics[randomIndex];
  const shuffledQuestions = shuffleArray([...selectedTopic.questions]);
  
  return { name: selectedTopic.name, questions: shuffledQuestions };
}

function getBlockName(blockNum) {
  if (blockNum === 1) return "СПЕЦІАЛЬНА ГІСТОЛОГІЯ";
  if (blockNum === 2) return "ЗАГАЛЬНА ГІСТОЛОГІЯ";
  return "ГІСТОЛОГІЧНІ ПРЕПАРАТИ";
}

window.onload = function() {
  startBlock();
};

function startBlock() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('summary-report').innerHTML = '';
  userAnswers = {};
  
  const randomTopic = getRandomTopic(currentBlockIndex);
  currentTopicInfo = randomTopic.name;
  currentQuestions = randomTopic.questions;
  
  blockResults[currentBlockIndex].topicName = currentTopicInfo;
  blockResults[currentBlockIndex].questions = currentQuestions;
  blockResults[currentBlockIndex].answers = [];
  
  let totalExamPoints = 0;
  currentQuestions.forEach(q => {
    totalExamPoints += q.points;
    userAnswers[q.id] = null;
    blockResults[currentBlockIndex].answers.push({ id: q.id, text: q.text, points: q.points, status: null });
  });
  blockResults[currentBlockIndex].total = totalExamPoints;
  blockResults[currentBlockIndex].earned = 0;
  
  timeLeft = 3 * 60; // 3 хвилини на блок для тесту
  
  document.getElementById('timer').style.display = 'block';
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      alert("Час вичерпано! Перехід до наступного блоку.");
      finishCurrentBlock();
    }
  }, 1000);
  
  renderQuestions();
}

function updateTimerDisplay() {
  let min = Math.floor(timeLeft / 60);
  let sec = timeLeft % 60;
  document.getElementById('timer').innerText = `Залишилось часу: ${min}:${sec < 10 ? '0' : ''}${sec}`;
}

function renderQuestions() {
  let html = `
    <div class="block-header">
      <h3>📚 БЛОК ${currentBlockIndex}: ${getBlockName(currentBlockIndex)}</h3>
      <p>🎲 Випадково обрана тема: <strong style="color:#00ff99;">${currentTopicInfo}</strong></p>
      <p>📝 Всього питань: ${currentQuestions.length} | ⏱️ Час на блок: 3 хвилини</p>
    </div>
  `;
  
  currentQuestions.forEach((q, index) => {
    let active0 = userAnswers[q.id] === 0 ? "active-0" : "";
    let active05 = userAnswers[q.id] === 0.5 ? "active-05" : "";
    let active1 = userAnswers[q.id] === 1 ? "active-1" : "";
    
    html += `
      <div class="question" id="q_container_${q.id}">
        <p><strong>Питання ${index + 1} [Бал: ${q.points}]:</strong> ${q.text}</p>
        <div class="btn-group">
          <button class="${active1}" onclick="setAnswer('${q.id}', 1)">Повна правильна відповідь (100%)</button>
          <button class="${active05}" onclick="setAnswer('${q.id}', 0.5)">Часткова/неповна відповідь (50%)</button>
          <button class="${active0}" onclick="setAnswer('${q.id}', 0)">Неправильна відповідь / Не знає (0%)</button>
        </div>
      </div>
    `;
  });
  
  html += `<button class="nav-btn" onclick="finishCurrentBlock()">ЗАВЕРШИТИ БЛОК ТА ПЕРЕЙТИ ДО НАСТУПНОГО</button>`;
  document.getElementById('block').innerHTML = html;
  window.scrollTo(0, 0);
}

function setAnswer(qId, val) {
  userAnswers[qId] = val;
  
  const answerIndex = blockResults[currentBlockIndex].answers.findIndex(a => a.id === qId);
  if (answerIndex !== -1) {
    blockResults[currentBlockIndex].answers[answerIndex].status = val;
  }
  
  const container = document.getElementById(`q_container_${qId}`);
  if (container) {
    const btns = container.querySelectorAll('.btn-group button');
    if (btns.length >= 3) {
      btns[0].className = val === 1 ? "active-1" : "";
      btns[1].className = val === 0.5 ? "active-05" : "";
      btns[2].className = val === 0 ? "active-0" : "";
    }
  }
}

function finishCurrentBlock() {
  if (timerInterval) clearInterval(timerInterval);
  
  let earned = 0;
  blockResults[currentBlockIndex].answers.forEach(a => {
    if (a.status === 1) earned += a.points;
    else if (a.status === 0.5) earned += (a.points * 0.5);
  });
  blockResults[currentBlockIndex].earned = earned;
  
  if (currentBlockIndex === 1) {
    currentBlockIndex = 2;
    startBlock();
  } else if (currentBlockIndex === 2) {
    currentBlockIndex = 3;
    startBlock();
  } else if (currentBlockIndex === 3) {
    showFinalResults();
  }
}

function getGrade(percentage) {
  if (percentage >= 90) return { grade5: 5, ects: "A", style: "good-grade" };
  if (percentage >= 85) return { grade5: 4, ects: "B", style: "good-grade" };
  if (percentage >= 75) return { grade5: 4, ects: "C", style: "good-grade" };
  if (percentage >= 65) return { grade5: 3, ects: "D", style: "normal-grade" };
  if (percentage >= 60) return { grade5: 3, ects: "E", style: "normal-grade" };
  if (percentage >= 35) return { grade5: 2, ects: "FX", style: "bad-grade" };
  return { grade5: 2, ects: "F", style: "bad-grade" };
}

function showFinalResults() {
  document.getElementById('timer').style.display = 'none';
  
  let totalEarned = 0;
  let totalMax = 0;
  let blocksHtml = "";
  
  for (let i = 1; i <= 3; i++) {
    const block = blockResults[i];
    const percentage = block.total > 0 ? (block.earned / block.total) * 100 : 0;
    const grade = getGrade(percentage);
    totalEarned += block.earned;
    totalMax += block.total;
    
    blocksHtml += `
      <div class="block-result" style="border-left-color: ${grade.style === 'good-grade' ? '#10ac84' : (grade.style === 'normal-grade' ? '#feca57' : '#ee5253')};">
        <h4>📖 БЛОК ${i}: ${block.name}</h4>
        <p><strong>Тема:</strong> ${block.topicName}</p>
        <p><strong>Результат:</strong> ${block.earned.toFixed(1)} / ${block.total} балів (${percentage.toFixed(1)}%)</p>
        <p><strong>Оцінка:</strong> <span class="${grade.style}">${grade.grade5} (${grade.ects})</span></p>
      </div>
    `;
  }
  
  const totalPercentage = totalMax > 0 ? (totalEarned / totalMax) * 100 : 0;
  const totalGrade = getGrade(totalPercentage);
  
  let reportHtml = `
    <div class="topic-title" style="text-align:center; font-weight:bold; color:#fff; font-size:22px; border-left:none; background:#222230;">
      🎓 ПІДСУМКОВИЙ ПРОТОКОЛ ІСПИТУ З ГІСТОЛОГІЇ
    </div>
    
    <div class="summary-block">
      <div class="final-score-row" style="margin-top:0;">
        <div>
          <strong>Загальний бал:</strong> <span class="${totalGrade.style}">${totalEarned.toFixed(1)} / ${totalMax}</span> 
          <span style="font-size:16px; color:#aaa;">(${totalPercentage.toFixed(1)}%)</span>
        </div>
        <div>
          <strong>Підсумкова оцінка:</strong> <span class="${totalGrade.style}">${totalGrade.grade5} (${totalGrade.ects})</span>
        </div>
      </div>
    </div>
    
    <h3 style="margin-top:25px; color:#ff9f43;">📊 РЕЗУЛЬТАТИ ПО БЛОКАХ</h3>
    ${blocksHtml}
  `;
  
  // Деталізація блоків
  for (let i = 1; i <= 3; i++) {
    const block = blockResults[i];
    if (!block.answers || block.answers.length === 0) continue;
    
    reportHtml += `
      <h3 style="margin-top:25px; color:#ff9f43;">📋 Деталізація блоку ${i}: ${block.name}</h3>
      <p><strong>Тема:</strong> ${block.topicName}</p>
      <table class="results-table">
        <thead>
          <tr><th>№</th><th>Питання</th><th>Макс</th><th>Набрано</th><th>Статус</th></tr>
        </thead>
        <tbody>
    `;
    
    block.answers.forEach((a, idx) => {
      let earned = 0;
      let label = "Не знає / Помилка";
      let cls = "bad-grade";
      
      if (a.status === 1) { earned = a.points; label = "Зараховано (100%)"; cls = "good-grade"; }
      else if (a.status === 0.5) { earned = a.points * 0.5; label = "Частково (50%)"; cls = "normal-grade"; }
      else if (a.status === null) { label = "Без відповіді"; }
      
      reportHtml += `
        <tr>
          <td>${idx + 1}</td>
          <td>${a.text}</td>
          <td><strong>${a.points}</strong></td>
          <td><strong class="${cls}">${earned.toFixed(1)}</strong></td>
          <td class="${cls}">${label}</td>
        </tr>
      `;
    });
    
    reportHtml += `</tbody></table>`;
  }
  
  reportHtml += `<button class="nav-btn" style="background:#282833; border:1px solid #444; margin-top:30px;" onclick="resetExam()">🔄 ПРОЙТИ ІСПИТ ЗНОВУ</button>`;
  
  document.getElementById('block').innerHTML = '';
  document.getElementById('summary-report').innerHTML = reportHtml;
  window.scrollTo(0, 0);
}

function resetExam() {
  blockResults = {
    1: { name: "Спеціальна гістологія", earned: 0, total: 0, answers: [], questions: [], topicName: "" },
    2: { name: "Загальна гістологія", earned: 0, total: 0, answers: [], questions: [], topicName: "" },
    3: { name: "Гістологічні препарати", earned: 0, total: 0, answers: [], questions: [], topicName: "" }
  };
  currentBlockIndex = 1;
  if (timerInterval) clearInterval(timerInterval);
  startBlock();
}
</script>

</body>
</html>
